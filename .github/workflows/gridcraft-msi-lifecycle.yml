# Independent MSI lifecycle gate; installation is allowed only on disposable GitHub-hosted runners.
name: GridCraft independent MSI lifecycle

on:
  pull_request:
    paths:
      - "packaging/windows/**"
      - ".github/workflows/gridcraft-msi-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gridcraft-msi-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-msi:
    name: Disposable Windows x64 MSI lifecycle
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout this independent repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Provision pinned WiX 5.0.2
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Check native Win32 MSI scripts parse
        shell: pwsh
        run: |
          foreach ($p in @(
            'packaging/windows/test-desktop-shortcut.ps1',
            'packaging/windows/test-msi-side-by-side.ps1',
            'packaging/windows/verify-isolated-msi-identity.ps1',
            'packaging/windows/verify-signing-payload.ps1',
            'packaging/windows/package.ps1'
          )) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if (@($errors).Count) { throw "Parse errors in $p : $($errors -join '; ')" }
          }
      - name: Install, repair, upgrade and remove independent MSI
        shell: pwsh
        run: ./packaging/windows/test-desktop-shortcut.ps1 -WorkDir "$env:RUNNER_TEMP\gridcraft-shortcut-smoke"
      - name: Verify real side-by-side isolation from historical MSI sentinel
        shell: pwsh
        run: ./packaging/windows/test-msi-side-by-side.ps1 -WorkDir "$env:RUNNER_TEMP\gridcraft-v49-isolation"
      - name: Retain MSI logs on failure for root-cause analysis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gridcraft-msi-lifecycle-failure-logs
          path: |
            ${{ runner.temp }}/gridcraft-shortcut-smoke/*.log
            ${{ runner.temp }}/gridcraft-v49-isolation/*.log
          if-no-files-found: warn
          retention-days: 7
