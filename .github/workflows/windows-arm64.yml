# Windows on ARM: package the ARM64 release the way release.yml does (cross-compiled on an x64
# runner, unsigned here), then install that MSI on a Windows 11 ARM64 runner, check the installed
# binaries are ARM64, run the CLI natively, and uninstall. (A native ARM64 `cargo test` job is left
# out for now: PdfCraft saw an intermittent access violation in egui UI tests there.)
name: Windows ARM64

# Builds run only from the `release` branch (a manual run from another branch is skipped).
on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-arm64:
    # Reusable external workflow runs at a separately verified immutable upstream commit.
    # Any change to it requires review, not an unreviewed upstream @main update.
    uses: storytold/craft-common-actions/.github/workflows/windows-arm64.yml@d7bf8f06e138618890d0ebe8a84a18b010bf3f66
    with:
      app-name: gridcraft
      app-dir: GridCraft
