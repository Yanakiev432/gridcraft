[package]
name = "gridcraft-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridCraft command line: inspect, convert, evaluate, script and serve MCP without a window"
publish = false

[lints]
workspace = true

[[bin]]
name = "gridcraft-cli"
path = "src/main.rs"

[dependencies]
gridcraft-engine = { workspace = true }
gridcraft-mcp = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# `check`: validating the packages GridCraft writes (content types, relationships).
zip = { workspace = true }
quick-xml = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
craft-signing-core = { version = "=0.1.0", git = "https://github.com/Yanakiev432/craft-signing-core.git", rev = "b7eb72a63b83247590a24b571288a0b7b970642c" }
